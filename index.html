:root[data-theme="dark"]{--bg:#151514;--card:#222220;--tx:#f0eee8;--mut:#9b988f;--ac:#7ea2f5;--ok:#5fc18a;--bad:#ee7b63;--bd:#33322e}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
main{max-width:520px;margin:0 auto;padding:16px 16px 90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}

nav button.on{color:var(--ac)}
h1{font-size:22px;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 17px inherit;font-family:inherit}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:14px 0}
.big{font-size:34px;font-weight:700}
.row3{font-size:22px;margin:6px 0}
.row3 small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.mut{color:var(--mut);font-size:14px}
.two{display:flex;gap:10px}
.two .btn.no{background:var(--bad)}.two .btn.yes{background:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item input{width:20px;height:20px;flex:none}
.item .t{flex:1;min-width:0;font-size:15px}
.item .t b{font-weight:700}
.tag{font-size:11px;color:var(--ac);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:6px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px inherit;font-family:inherit;margin:0 0 8px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 14px}
summary{font-weight:600}
.act{display:flex;gap:8px;margin:0 0 12px}
.act input{margin:0;flex:1}
.act .btn{width:auto;padding:12px 14px;font-size:15px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 14px;margin:0 0 8px;font:inherit;font-family:inherit}
.lrow.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.lrow .pb{grid-column:1/3;height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:6px}
.lrow .pb b{display:block;height:100%;background:var(--ok)}

const KEY='verben-v1';
let V=[];
try{V=JSON.parse(localStorage.getItem(KEY)||'null')||[]}catch(e){V=[]}
const seedList=SEED.split('\n').map((l,i)=>{const p=l.split('|');return{id:i+1,inf:p[0],pr:p[1],pp:p[2],aux:p[3],uk:p[4],lesson:'',ok:0}});
let sv=0;try{sv=+localStorage.getItem('verben-ver')||0}catch(e){}
if(!V.length){V=seedList}
else if(sv<2){const have=new Set(V.map(v=>v.inf));seedList.forEach(x=>{if(!have.has(x.inf))V.push(x)})}
try{localStorage.setItem('verben-ver','2')}catch(e){}
save();
function save(){try{localStorage.setItem(KEY,JSON.stringify(V))}catch(e){}}
function saveSess(){try{localStorage.setItem('verben-sess',JSON.stringify({sf,q:q.map(v=>v.id),total,ft:firstTry}))}catch(e){}}
function clearSess(){try{localStorage.removeItem('verben-sess')}catch(e){}}
function loadSess(){try{const x=JSON.parse(localStorage.getItem('verben-sess')||'null');if(x&&x.q){x.q=x.q.filter(id=>V.some(v=>v.id===id))}return x}catch(e){return null}}
function prog(f){const L=V.filter(v=>inF(v,f));return{n:L.length,d:L.filter(v=>(v.ok||0)>=3).length}}
function lessonList(){
  const all=[['all','Всі'],...lessons().map(l=>[l,l]),['none','Без уроку']];
  return all.map(([k,n])=>{const p=prog(k);if(!p.n)return '';
    return `<button class="lrow ${sf===k?'on':''}" data-a="sf" data-k="${esc(k)}"><span>${esc(n)}</span><span class="mut">${p.d}/${p.n} вивчено</span><i class="pb"><b style="width:${p.d/p.n*100}%"></b></i></button>`}).join('');
}
let tab='study',sf='all',lf='all',sel=new Set(),q=[],total=0,flip=false,session=false,firstTry={};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lessons=()=>[...new Set(V.map(v=>v.lesson).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'uk',{numeric:true}));
const inF=(v,f)=>f==='all'||(f==='none'?!v.lesson:v.lesson===f);
function chips(cur,prefix){
  const L=lessons();
  const all=[['all','Всі'],...L.map(l=>[l,l]),['none','Без уроку']];
  return '<div class="chips">'+all.map(([k,n])=>`<button class="chip ${cur===k?'on':''}" data-a="${prefix}" data-k="${esc(k)}">${esc(n)}</button>`).join('')+'</div>';
}
function render(){
  $('#t1').className=tab==='study'?'on':'';$('#t2').className=tab==='lib'?'on':'';
  app.innerHTML=tab==='study'?study():lib();
}
function study(){
  if(!session){
    const n=V.filter(v=>inF(v,sf)).length;
    const ss=loadSess(),rs=ss&&ss.q.length?`<button class="btn" data-a="resume" style="margin-bottom:14px">Продовжити (залишилось ${ss.q.length})</button>`:'';
    return `<h1>Які дієслова вчимо?</h1>${rs}${lessonList()}<p class="mut">Обрано дієслів: ${n}</p>
    <button class="btn" data-a="start" ${n?'':'disabled'}>Почати</button>
    <p class="mut">Інфінітив → Präteritum → Partizip II. Що не знаєш, повертається в колоду, доки не вивчиш.</p>`;
  }
  if(!q.length){
    return `<h1>Готово! 🎉</h1><div class="card"><div class="big">${total}/${total}</div><p class="mut">Усі дієслова пройдено</p></div>
    <button class="btn" data-a="start">Ще раз</button><br><button class="btn g" data-a="menu">Обрати інший урок</button>`;
  }
  const v=q[0],done=total-q.length;
  const face=flip
   ?`<div class="big" style="font-size:24px">${esc(v.inf)}</div>
     <div class="row3"><small>Präteritum</small>${esc(v.pr)}</div>
     <div class="row3"><small>Partizip II</small>${esc(v.aux)} ${esc(v.pp)}</div>
     <div class="mut">${esc(v.uk)}</div>`
   :`<div class="big">${esc(v.inf)}</div><p class="mut">${esc(v.uk)}</p><p class="mut">торкнись, щоб побачити форми</p>`;
  return `<div class="bar"><i style="width:${done/total*100}%"></i></div><p class="mut">Залишилось: ${q.length}</p>
   <div class="card" data-a="flip">${face}</div>
   ${flip?`<div class="two"><button class="btn no" data-a="no">Не знаю</button><button class="btn yes" data-a="yes">Знаю</button></div>`:''}
   <button class="btn g" style="margin-top:14px" data-a="menu">Завершити</button>`;
}
function lib(){
  const L=V.filter(v=>inF(v,lf));
  return `<h1>Дієслова (${V.length})</h1>
  <details><summary>+ Додати своє дієслово</summary><div style="margin-top:10px">
   <input type="text" id="n_inf" placeholder="Infinitiv (напр. gehen)" autocapitalize="off">
   <input type="text" id="n_pr" placeholder="Präteritum (ging)" autocapitalize="off">
   <input type="text" id="n_pp" placeholder="Partizip II (gegangen)" autocapitalize="off">
   <input type="text" id="n_aux" placeholder="hat / ist" autocapitalize="off">
   <input type="text" id="n_uk" placeholder="Переклад">
   <input type="text" id="n_l" placeholder="Урок (необов'язково)">
   <button class="btn" data-a="add">Додати</button></div></details>
  ${chips(lf,'lf')}${lf!=='all'?(()=>{const p=prog(lf);return `<p class="mut">Вивчено ${p.d} з ${p.n} · ✅ вивчено · 🔸 в процесі · ○ нове</p>`})():`<p class="mut">✅ вивчено · 🔸 в процесі · ○ нове</p>`}
  <div class="act"><input type="text" id="lname" placeholder="Назва уроку, напр. Урок 5"><button class="btn" data-a="assign">Призначити</button></div>
  <div class="act"><button class="btn g" data-a="selall">Вибрати всі</button><button class="btn g" data-a="del">Видалити</button></div>
  <div class="act"><button class="btn g" data-a="restore">Restore: повернути видалені слова</button></div>
  <div class="act"><button class="btn g" data-a="exp">Копіювати прогрес</button><button class="btn g" data-a="imp">Вставити прогрес</button></div>
  <input type="text" id="bk" placeholder="Тут з'явиться (або сюди вставити) збережений прогрес">
  ${L.map(v=>`<label class="item"><input type="checkbox" data-id="${v.id}" ${sel.has(v.id)?'checked':''}>
   <span class="t"><b>${esc(v.inf)}</b> · ${esc(v.pr)} · ${esc(v.aux)} ${esc(v.pp)}${v.lesson?`<span class="tag">${esc(v.lesson)}</span>`:''}${v.ok>=3?' ✅':v.ok>0?' 🔸':' ○'}<br><span class="mut">${esc(v.uk)}</span></span></label>`).join('')}`;
}
function start(){
  q=V.filter(v=>inF(v,sf)).map(v=>v.id);
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  q=q.map(id=>V.find(v=>v.id===id));total=q.length;flip=false;session=true;firstTry={};saveSess();
}
app.addEventListener('change',e=>{
  if(e.target.dataset.id){const id=+e.target.dataset.id;e.target.checked?sel.add(id):sel.delete(id)}
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k;
  if(a==='sf'){sf=k}
  else if(a==='lf'){lf=k;sel.clear()}
  else if(a==='start'){start()}
  else if(a==='menu'){session=false}
  else if(a==='flip'){flip=!flip}
  else if(a==='yes'||a==='no'){
    const v=q.shift();
    if(a==='yes'){ if(!(v.id in firstTry)){v.ok=(v.ok||0)+1} firstTry[v.id]=1; }
    else{ if(!(v.id in firstTry)){v.ok=0;firstTry[v.id]=0} q.splice(Math.min(3,q.length),0,v); }
    flip=false;save();if(q.length)saveSess();else clearSess();
  }
  else if(a==='exp'){const t=JSON.stringify(V),i=$('#bk');i.value=t;i.select();try{navigator.clipboard.writeText(t)}catch(e){}return}
  else if(a==='imp'){try{const arr=JSON.parse($('#bk').value);if(Array.isArray(arr)&&arr.length&&arr[0].inf){V=arr;save()}}catch(e){}}
  else if(a==='restore'){const have=new Set(V.map(v=>v.inf));seedList.forEach(x=>{if(!have.has(x.inf))V.push({...x})});save()}
  else if(a==='resume'){const ss=loadSess();if(ss&&ss.q.length){sf=ss.sf||'all';q=ss.q.map(id=>V.find(v=>v.id===id));total=ss.total||q.length;firstTry=ss.ft||{};flip=false;session=true}}
  else if(a==='selall'){const L=V.filter(v=>inF(v,lf));const all=L.every(v=>sel.has(v.id));L.forEach(v=>all?sel.delete(v.id):sel.add(v.id))}
  else if(a==='assign'){
    const n=$('#lname').value.trim();
    if(!n||!sel.size)return;
    V.forEach(v=>{if(sel.has(v.id))v.lesson=n});sel.clear();save();
  }
  else if(a==='del'){
    if(!sel.size)return;
    V=V.filter(v=>!sel.has(v.id));sel.clear();save();
  }
  else if(a==='add'){
    const g=id=>$('#'+id).value.trim();
    if(!g('n_inf')||!g('n_pr')||!g('n_pp'))return;
    V.push({id:Date.now(),inf:g('n_inf'),pr:g('n_pr'),pp:g('n_pp'),aux:g('n_aux')||'hat',uk:g('n_uk'),lesson:g('n_l'),ok:0});save();
  }
  render();
});
$('#t1').onclick=()=>{tab='study';render()};
$('#t2').onclick=()=>{tab='lib';render()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
